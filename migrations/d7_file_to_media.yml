id: d7_file_to_media
label: 'D7 managed files to D11 image media'
migration_group: d7_to_d11_content
migration_tags:
  - 'Drupal 7'
  - Content
  - d7_to_d11
  - media

source:
  plugin: d7_file

process:
  # Image bundle only. Documents and other MIME types are skipped; extend
  # this list (or add a second migration) if you also migrate those as media.
  _skip_non_image:
    plugin: skip_on_value
    method: row
    not_equals: true
    source: filemime
    value:
      - image/jpeg
      - image/jpg
      - image/png
      - image/gif
      - image/webp
      - image/svg+xml

  name: filename
  status: status
  created: timestamp
  changed: timestamp

  uid:
    plugin: migration_lookup
    migration: d7_users
    source: uid
    no_stub: true

  bundle:
    plugin: default_value
    default_value: image

  # The file entity is created by d7_files; this migration only wraps it.
  'field_media_image/target_id':
    -
      plugin: migration_lookup
      migration: d7_files
      source: fid
      no_stub: true
    -
      plugin: skip_on_empty
      method: row
  'field_media_image/alt': filename
  'field_media_image/title': filename

destination:
  plugin: 'entity:media'
  default_bundle: image

migration_dependencies:
  required:
    - d7_files
  optional:
    - d7_users
